# Railway: build bằng Dockerfile trong thư mục này (chạy `railway up` trong 06-lab-complete/)
# Biến môi trường đặt trên dashboard / CLI, không ghi ở đây:
#   AGENT_API_KEY, REDIS_URL (tham chiếu tới Redis service: ${{Redis.REDIS_URL}}),
#   ENVIRONMENT=production, RATE_LIMIT_PER_MINUTE, DAILY_BUDGET_USD
# PORT do Railway cấp, CMD trong Dockerfile đọc ${PORT:-8000}.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
