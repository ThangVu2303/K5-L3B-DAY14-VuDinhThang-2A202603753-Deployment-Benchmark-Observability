# Render Blueprint: agent (Docker) + Key Value (Redis)
# Render đọc Blueprint ở gốc repo theo mặc định; nếu dùng file này, chọn đường dẫn
# 06-lab-complete/render.yaml khi tạo Blueprint. Mọi đường dẫn bên dưới tính từ gốc repo.
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    dockerContext: ./06-lab-complete
    dockerfilePath: ./06-lab-complete/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true          # Render tự sinh, không ghi giá trị vào repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []                  # chỉ cho các service trong cùng tài khoản Render truy cập
